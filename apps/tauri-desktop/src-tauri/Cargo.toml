[package]
name = "trilium-tauri"
version = "0.99.4"
description = "Trilium Notes - Tauri Desktop"
authors = ["Trilium Notes Team"]
license = "AGPL-3.0-only"
repository = "https://github.com/TriliumNext/Trilium"
edition = "2021"

[lib]
name = "trilium_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.7", features = [] }

[dependencies]
tauri = { version = "2.2.0", features = ["protocol-asset"] }
tauri-plugin-shell = "2.0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
# This feature is used for production builds or when `devPath` points to the filesystem
# DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]
